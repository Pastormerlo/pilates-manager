<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar — Pilates Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand: #2D6A4F;
            --brand-light: #52B788;
            --brand-pale: #D8F3DC;
            --dark: #1B1F23;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #1B1F23 0%, #2D3A30 50%, #1B1F23 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-wrap {
            width: 100%;
            max-width: 400px;
        }
        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .brand-icon {
            width: 64px; height: 64px;
            background: var(--brand);
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem;
            color: #fff;
            margin: 0 auto 1rem;
        }
        .brand-header h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 1.7rem;
            color: #fff;
            margin-bottom: 0.3rem;
        }
        .brand-header p {
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
        }
        .card-login {
            background: #fff;
            border-radius: 18px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .form-label-custom {
            font-size: 0.72rem;
            font-weight: 600;
            color: #6C757D;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            display: block;
            margin-bottom: 5px;
        }
        .form-control-custom {
            width: 100%;
            border: 1.5px solid #E2E8E0;
            border-radius: 10px;
            padding: 0.55rem 0.9rem;
            font-size: 0.9rem;
            font-family: 'DM Sans', sans-serif;
            transition: border-color 0.2s;
            outline: none;
            background: #FAFAFA;
        }
        .form-control-custom:focus {
            border-color: var(--brand-light);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(82,183,136,0.15);
        }
        .input-group-custom {
            position: relative;
        }
        .input-group-custom .form-control-custom {
            padding-right: 42px;
        }
        .eye-btn {
            position: absolute;
            right: 12px; top: 50%;
            transform: translateY(-50%);
            background: none; border: none;
            color: #aaa; cursor: pointer;
            font-size: 0.85rem;
            padding: 0;
            transition: color 0.2s;
        }
        .eye-btn:hover { color: var(--brand); }
        .btn-login {
            width: 100%;
            background: var(--brand);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 0.65rem;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.03em;
        }
        .btn-login:hover { background: var(--brand-light); }
        .alert-error {
            background: #FFE5E5;
            color: #C0392B;
            border-radius: 10px;
            padding: 0.6rem 0.9rem;
            font-size: 0.83rem;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .divider {
            border: none;
            border-top: 1px solid #F0F0F0;
            margin: 1.5rem 0;
        }
        .link-registro {
            text-align: center;
            font-size: 0.83rem;
            color: #6C757D;
        }
        .link-registro a {
            color: var(--brand);
            font-weight: 600;
            text-decoration: none;
        }
        .link-registro a:hover { text-decoration: underline; }
        .mb-field { margin-bottom: 1.1rem; }
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="brand-header">
        <div class="brand-icon"><i class="fas fa-leaf"></i></div>
        <h1>Pilates Manager</h1>
        <p>Ingresá a tu estudio</p>
    </div>

    <div class="card-login">
        {% if error %}
        <div class="alert-error">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
        </div>
        {% endif %}

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
            <div class="alert-error" {% if cat == 'success' %}style="background:#D8F3DC;color:#2D6A4F;"{% endif %}>{{ msg }}</div>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">
            <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
            <div class="mb-field">
                <label class="form-label-custom">Email</label>
                <input type="email" name="email" class="form-control-custom"
                       placeholder="nombre@ejemplo.com" required autofocus>
            </div>
            <div class="mb-field">
                <label class="form-label-custom">Contraseña</label>
                <div class="input-group-custom">
                    <input type="password" name="password" id="pass"
                           class="form-control-custom" required>
                    <button type="button" class="eye-btn" onclick="togglePass()">
                        <i class="fas fa-eye" id="eye-icon"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-login">ENTRAR</button>
        </form>

        <hr class="divider">
        <div class="link-registro">
            ¿No tenés cuenta? <a href="/registro">Registrá tu estudio</a>
        </div>
    </div>
</div>

<script>
function togglePass() {
    const p = document.getElementById('pass');
    const i = document.getElementById('eye-icon');
    if (p.type === 'password') {
        p.type = 'text';
        i.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        p.type = 'password';
        i.classList.replace('fa-eye-slash', 'fa-eye');
    }
}
</script>
</body>
</html>
